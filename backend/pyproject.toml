[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.120.2",
    "anyio>=4.14.2",
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "ddgs>=9.14.4",
    "docker>=7.2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "geopy>=2.5.0",
    "google-auth>=2.56.2",
    "google-genai>=2.16.0",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "openai>=2.52.0",
    "numpy>=2.5.1",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "timezonefinder>=8.2.5",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.52.1",
    "xlrd>=2.0.2",
    "sentence-transformers>=5.6.1",
    "langchain-core>=1.5.3",
    "json-repair>=0.61.7",
    "pyjwt[crypto]>=2.13.0",
    "mcp>=1.9,<2",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
