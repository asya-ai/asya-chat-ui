services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    labels:
      - autoheal=true
    # ports:
      # - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: chatui-backend
    build:
      context: ./backend
      args:
        AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AGENT_EMBEDDING_MODEL=${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    # wait_for_db polls; don't block on postgres healthcheck intervals.
    depends_on:
      postgres:
        condition: service_started
    command: ["sh", "-c", "uv run python app/db/wait_for_db.py && uv run alembic upgrade head"]
    restart: "no"

  backend:
    image: chatui-backend
    build:
      context: ./backend
      args:
        AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    env_file:
      - .env
    environment:
      - PROJECT_ROOT_DIR=${PWD}
      - EXEC_HOST_FILES_DIR=/data/files
      - DOCKER_HOST=tcp://dind:2375
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AGENT_EMBEDDING_MODEL=${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - ./data/files:/data/files
    # Boot deps only. scraper / dind / executor-bootstrap are runtime; they
    # start in parallel on `compose up` and must not gate API/workers.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  dind:
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-data:/var/lib/docker
      - ./data/files:/data/files
      - ./backend/executor:/executor:ro
    healthcheck:
      test: ["CMD-SHELL", "docker info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build:
      context: ./scraper
    env_file:
      - .env
    # Chrome needs more than Docker's default 64MB /dev/shm.
    shm_size: "256mb"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/healthz').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7
    restart: unless-stopped

  worker:
    image: chatui-backend
    build:
      context: ./backend
      args:
        AGENT_EMBEDDING_MODEL: ${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    env_file:
      - .env
    environment:
      - PROJECT_ROOT_DIR=${PWD}
      - EXEC_HOST_FILES_DIR=/data/files
      - DOCKER_HOST=tcp://dind:2375
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AGENT_EMBEDDING_MODEL=${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    volumes:
      - ./data/files:/data/files
    # migrate already implies postgres; no scraper/dind/executor gate.
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "celery", "-A", "app.workers.celery_app.celery_app", "worker", "-l", "info", "-Q", "generation,celery,embedding", "--concurrency=${WORKER_CONCURRENCY:-2}", "--prefetch-multiplier=1"]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: on-failure

  beat:
    image: chatui-backend
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AGENT_EMBEDDING_MODEL=${AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: ["uv", "run", "celery", "-A", "app.workers.celery_app.celery_app", "beat", "-l", "info"]
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      backend:
        condition: service_healthy

  # Builds the Python execution image inside dind (not on the host daemon).
  executor-bootstrap:
    image: docker:cli
    environment:
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - ./backend/executor:/executor:ro
    depends_on:
      dind:
        condition: service_healthy
    command:
      - sh
      - -ec
      - docker build -t chatui-python-exec:latest /executor
    restart: "no"

  # Host-only build target (optional); code execution uses the image in dind instead.
  executor:
    build:
      context: ./backend/executor
    image: chatui-python-exec:latest
    profiles:
      - exec

volumes:
  dind-data:
