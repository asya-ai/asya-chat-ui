map $http_x_forwarded_proto $real_scheme {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Docker embedded DNS. Variable proxy_pass re-resolves backend after recreates
# so nginx does not keep a stale container IP (avoids full --force-recreate).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  client_max_body_size 25m;
  set $backend_host backend;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Exact matches only — prefix `/api/auth/login` would also catch
  # `/api/auth/login-resolve`. With variable proxy_pass the URI is sent as-is
  # (no remainder append), so resolve was rewritten to POST /auth/login → 422,
  # and those hits burned the login rate limit → 503.
  location = /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
    proxy_pass http://$backend_host:8000/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/auth/register {
    limit_req zone=login_limit burst=5 nodelay;
    proxy_pass http://$backend_host:8000/auth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/auth/password-reset {
    limit_req zone=auth_sensitive_limit burst=10 nodelay;
    proxy_pass http://$backend_host:8000/auth/password-reset;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/auth/password-reset/confirm {
    limit_req zone=auth_sensitive_limit burst=10 nodelay;
    proxy_pass http://$backend_host:8000/auth/password-reset/confirm;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/auth/invites/accept {
    limit_req zone=auth_sensitive_limit burst=10 nodelay;
    proxy_pass http://$backend_host:8000/auth/invites/accept;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/v1/chat/completions {
    limit_req zone=api_burst_limit burst=30 nodelay;
    proxy_pass http://$backend_host:8000/v1/chat/completions;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  location ~ ^/api/chats/.+/ws$ {
    limit_req zone=api_burst_limit burst=30 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_host:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_host:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 25m;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location = /robots.txt {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=300" always;
    try_files /robots.txt =404;
  }

  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files /manifest.webmanifest =404;
  }

  location ~* ^/(assets/.*\.(js|css)|logo_asya(?:_light)?\.png|logo_chat\.svg|pwa-.*\.png|apple-touch-icon\.png|(?:google-sans-flex|instrument-serif)[^/]*\.woff2)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files /sw.js =404;
  }

  location ~* ^/workbox-.*\.js$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }


  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
