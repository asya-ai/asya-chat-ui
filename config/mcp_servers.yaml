# MCP servers exposed to the model as tools.
# Mount this directory into backend/worker as /config (see docker-compose).
# Auth headers and env expansion (${VAR}) are supported — leave unset for public servers.
#
# Full schema example (disabled):
#   - id: example-authed
#     name: Example Authed Server
#     enabled: false
#     transport: http          # http | sse | stdio
#     url: https://example.com/mcp
#     # command: npx
#     # args: ["-y", "some-mcp-server"]
#     # env:
#     #   FOO: bar
#     description: Optional blurb for the model.
#     headers:
#       Authorization: "Bearer ${SOME_API_TOKEN}"
#     include:
#       tools: true
#       resources: true
#       prompts: true
#     tool_allowlist: null
#     tool_blocklist: null

servers:
  - id: data-lv
    name: Latvia Open Data
    transport: http
    url: https://gateway.pipeworx.io/data-lv/mcp
    enabled: true
    description: Search and query datasets from data.gov.lv (CKAN).
  - id: latvia-statistics
    name: Latvia Statistics
    transport: http
    url: https://mcp-px.stat.gov.lv/mcp
    enabled: true
    description: Access 1,000+ official Latvian statistical tables through AI assistants. Population, economy, wages, education, environment — data from 1920 to present.
  - id: latvia-human-capital
    name: Latvia Human Capital
    transport: http
    url: https://mcp-hc.stat.gov.lv/mcp
    enabled: true
    description: vacancies from 4 employment portals with occupation codes, salary data, skills classification, and employer analytics
